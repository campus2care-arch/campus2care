name: One-time C2C live form verification
on:
  push:
    paths:
      - .github/workflows/c2c-temp-live-form-smoke.yml
permissions:
  contents: read
jobs:
  live-forms:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Submit labeled QA application and availability
        env:
          QA_RUN_ID: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const run = process.env.QA_RUN_ID;
          const name = 'Campus2Care QA Test ' + run;
          const email = 'campus2care-qa-' + run + '@example.com';
          const submissionId = 'c2c-qa-live-' + run;
          console.log('QA_IDENTIFIERS ' + JSON.stringify({name,email,submissionId}));
          const days = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
          const applicationDays = Object.fromEntries(days.map(day => [day, 'Unavailable']));
          applicationDays.Monday='8am–12pm';
          applicationDays.Wednesday='10am–12pm';
          const post=async(path,data)=>{
            const response=await fetch('https://www.campus2care.org'+path,{
              method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify(data),signal:AbortSignal.timeout(90000)
            });
            const raw=await response.text();
            let body; try {body=JSON.parse(raw)}catch{body={raw:raw.slice(0,200)}}
            console.log(path+' status='+response.status+' response='+JSON.stringify(body));
            assert.ok(response.ok, path+' failed with HTTP '+response.status);
            assert.equal(body.ok,true);
            return body;
          };
          const app=await post('/api/application',{
            submissionId,fullName:name,email,alternateEmail:'',phone:'202-555-0188',
            school:'Campus2Care Synthetic QA',graduationYear:2027,major:'Test Only',
            clinicalCertification:'No',priorClinicalExperience:'No',
            comfortableWithPatients:'Yes',preferredStartDate:'2026-11-01',
            weeklyCommitmentHours:6,motivation:'PRODUCTION QA TEST ONLY - DELETE RECORDS - NO CONTACT',
            referralSource:'Synthetic smoke test',availabilityNotes:'QA ONLY - DELETE',
            totalHours:6,longestWeekdayBlockHours:4,meetsWeekdayBlock:true,availabilityByDay:applicationDays
          });
          assert.equal(app.pipelineAction,'created');
          assert.ok(app.pipelineId && app.availabilityId,'Expected new Pipeline and Availability Profile IDs');
          console.log('QA_APPLICATION_CREATED '+JSON.stringify({pipelineId:app.pipelineId,availabilityId:app.availabilityId}));
          const standaloneDays=Object.fromEntries(days.map(day=>[day,'unavailable']));
          standaloneDays.Tuesday='9am–1pm'; standaloneDays.Thursday='3pm–5pm';
          const avail=await post('/api/availability',{
            submissionId:'c2c-qa-live-availability-'+run,
            name,email,altEmail:'',notes:'PRODUCTION QA TEST ONLY - DELETE RECORDS - NO CONTACT',
            totalHours:6,longestWeekdayBlockHours:4,meetsWeekdayBlock:true,
            availabilityByDay:standaloneDays
          });
          assert.equal(avail.matched,true,'Expected availability submission linked to Pipeline');
          console.log('QA_LIVE_FORMS_SUCCESS '+JSON.stringify({name,email,submissionId,pipelineId:app.pipelineId,applicationAvailabilityId:app.availabilityId}));
          NODE