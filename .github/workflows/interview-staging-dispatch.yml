name: Interview staging dispatcher
on:
  push:
    branches: [feature/interview-scheduling-foundation-20261028]
    paths: [.github/workflows/interview-staging-dispatch.yml]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: interview-staging-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    if: vars.INTERVIEW_STAGING_SCHEDULER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call protected staging scheduler with Vercel automation bypass
        env:
          SCHEDULER_URL: ${{ secrets.INTERVIEW_STAGING_SCHEDULER_URL }}
          SCHEDULER_SECRET: ${{ secrets.INTERVIEW_STAGING_SCHEDULER_SECRET }}
          VERCEL_BYPASS_SECRET: ${{ secrets.INTERVIEW_STAGING_VERCEL_BYPASS_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SCHEDULER_URL:-}" || -z "${SCHEDULER_SECRET:-}" ]]; then
            echo "::error::Staging scheduler URL or application bearer secret is not configured."
            exit 1
          fi
          if [[ -z "${VERCEL_BYPASS_SECRET:-}" ]]; then
            echo "::error::Configure Vercel Protection Bypass for Automation and set the repository secret INTERVIEW_STAGING_VERCEL_BYPASS_SECRET. Do not disable Vercel Authentication."
            exit 1
          fi
          case "$SCHEDULER_URL" in
            https://*.vercel.app/api/interview/scheduler* ) ;;
            * ) echo "::error::Staging URL must point to a protected preview /api/interview/scheduler endpoint."; exit 1 ;;
          esac
          status="$(curl --silent --show-error --max-time 65 --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "x-vercel-protection-bypass: $VERCEL_BYPASS_SECRET" \
            --header "Authorization: Bearer $SCHEDULER_SECRET" \
            --header 'Content-Type: application/json' \
            --data '{}' "${SCHEDULER_URL%%\?*}")"
          if [[ "$status" != "200" ]]; then
            echo "::error::Staging scheduler returned HTTP $status. 401: check Vercel automation bypass; 403: check application bearer; 503: inspect app/database logs."
            exit 1
          fi
          echo "Staging scheduler returned HTTP 200."
