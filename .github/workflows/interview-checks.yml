name: Interview checks
on:
  pull_request:
    paths: ['app/interview/**', 'app/api/interview/**', 'lib/interview-*.ts', 'test/**', 'package*.json', '.github/workflows/interview-checks.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
