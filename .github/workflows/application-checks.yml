name: Application checks

on:
  pull_request:
    paths:
      - "app/api/application/**"
      - "app/application/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/application-checks.yml"
  push:
    branches: [main]
    paths:
      - "app/api/application/**"
      - "app/application/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/application-checks.yml"

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit
